name: Eseguibili

# Compila l'app come file eseguibile autonomo per Linux, macOS e Windows.
# Avvio manuale (Actions > Eseguibili > Run workflow) oppure pubblicando un tag "v*" (crea anche la release).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }       # Apple Silicon
          - { os: macos-15-intel, name: macos-x64 }       # Mac Intel
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: notion-clone-${{ matrix.name }}
          path: release/notion-clone-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/* }
